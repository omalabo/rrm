

{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" {% block html %}data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"{% endblock html %}>
<head>
    <meta charset="utf-8" />
    <title>RRM - Mécanisme de réponse rapide - Niger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico'%}">

    <!-- Layout config Js -->
    <script src="{% static 'js/layout.js'%}"></script>
    <!-- Bootstrap Css -->
    <link href="{% static 'csslogin/bootstrap.min.css'%}" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'csslogin/icons.min.css'%}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="{% static 'csslogin/app.min.css'%}" id="app-style" rel="stylesheet" type="text/css" />
    <!-- custom Css-->
    <link href="{% static 'csslogin/custom.min.css'%}" id="app-style" rel="stylesheet" type="text/css" />

    <style>
        .image-container {
            position: relative;
            width: 100%;
            height: 33vh;
            background: url("{% static 'images/logos/idp_apprrm.jpg' %}") no-repeat center center;
            background-size: cover;
        }
        #auth-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            z-index: 1000;
        }
        .topbar img {
            max-width: 100%;
            height: auto;
            flex-shrink: 0;
        }
        @media (max-width: 1200px) {
            .topbar img {
                width: 10%;
            }
        }
        @media (max-width: 992px) {
            .topbar img {
                width: 12%;
            }
        }
        @media (max-width: 768px) {
            .topbar img {
                width: 15%;
            }
        }
        @media (max-width: 576px) {
            .topbar img {
                width: 20%;
            }
        }
        @media (max-width: 480px) {
            .topbar img {
                width: 25%;
            }
        }
        .footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-page-wrapper">
        <div class="image-container">
        <!-- auth page bg -->
        <div class="auth-one-bg-position auth-one-bg"  id="auth-particles">
            <div class="bg-overlay"></div>
            
            <div class="shape">
                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 120">
                    <path d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
                </svg>
            </div>
        </div>

        <!-- auth page content -->
        <div class="auth-page-content">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="text-center mt-sm-5 mb-4 text-white-50">
                            <div>
                                    <img src="{% static 'images/logo-light.png'%}" alt="" height="20">
                               
                            </div>
                            <h3 class=" fw-medium text-white-50">RRM - Mécanisme de réponse rapide - Niger</h3>
                        </div>
                    </div>
                </div>
                
                <!-- end row -->

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6 col-xl-5">
                        <div class="card mt-4">
                        
                            <div class="card-body p-4"> 
                                <div class="text-center mt-2">
                                    <h5 class="text-primary">Connexion</h5>
                                    <p class="text-muted">Identifiez-vous pour continuer sur RRM</p>
                                </div>
                                <div class="p-2 mt-4">
                                    <form method="POST">
                                        {% csrf_token %}
                                        <div class="mb-3">
                                            {{ form|crispy }}
                                        </div>
                
                                       
                                        
                                        <div class="mt-4">
                                            <button class="btn btn-success w-100" type="login">Connexion</button>
                                        </div>

                                       
                                    </form>
                                </div>
                            </div>
                            <!-- end card body -->
                        </div>
                        <!-- end card -->

                      

                    </div>
                </div>
                <!-- end row -->
            </div>
            <!-- end container -->
        </div>
        <!-- end auth page content -->
        
    </div>

    <div class="topbar" style="margin-top: 22rem;">
        <img src="/static/images/logos/Coat_of_arms_of_Niger.svg"alt="HTML5 Icon">
        <img src="/static/images/logos/UNICEF_Logo.svg"  alt="HTML5 Icon"  >
        <img src="/static/images/logos/wfp-logo-standard-blue-fr.svg" alt="HTML5 Icon" >
        <img src="/static/images/logos/ocha.svg"alt="HTML5 Icon">
         <img src="/static/images/logos/iom.svg"alt="HTML5 Icon">
         <img src="/static/images/logos/IRC.svg"alt="HTML5 Icon">
         <img src="/static/images/logos/DRC.jpg"alt="HTML5 Icon">
         <img src="/static/images/logos/ACF.svg"alt="HTML5 Icon">
         

    </div>
   
        <!-- footer -->
        <footer class="footer">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="text-center">
                            
                            
                            <p class="mb-0 text-muted">&copy; <script>document.write(new Date().getFullYear())</script> RRM</p>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <!-- end Footer -->

    </div>
    <!-- JAVASCRIPT -->
    <script src="{% static 'libs/bootstrap/dist/js/bootstrap.bundle.min.js'%}"></script>
    <script src="{% static 'libs/simplebar/dist/simplebar.min.js'%}"></script>
    <script src="{% static 'libs/node-waves/dist/waves.min.js'%}"></script>
    <script src="{% static 'libs/feather-icons/dist/feather.min.js'%}"></script>
    <script src="{% static 'js/pages/plugins/lord-icon-2.1.0.js'%}"></script>
    <script src="{% static 'js/plugins.js'%}"></script>
    <!-- particles js -->
    <script src="{% static 'libs/particles.js/particles.js'%}"></script>
    <!-- particles app js -->
    <script src="{% static 'js/pages/particles.app.js'%}"></script>
    <!-- password-addon init -->
    <script src="{% static 'js/pages/password-addon.init.js'%}"></script>
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
</body>
</html>
