<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Communale</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .highcharts-figure {
            min-width: 310px;
            max-width: 800px;
            margin: 1em auto;
        }
        .highcharts-data-table table {
            border-collapse: collapse;
            border-spacing: 0;
            margin: 10px auto;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .highcharts-data-table th {
            font-weight: 600;
            padding: 0.5em;
        }
        .highcharts-data-table td,
        .highcharts-data-table th,
        .highcharts-data-table caption {
            padding: 0.5em;
        }
        .highcharts-data-table thead tr,
        .highcharts-data-table tr:nth-child(even) {
            background: #f8f8f8;
        }
        .highcharts-data-table tr:hover {
            background: #f1f7ff;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% load static %}
    {% load plotly_dash %}
    {% block content %}
    <div class="container-fluid">
        <div class="page-loader">
            <div class="loader">Chargement...</div>
        </div>

        <div class="jumbotron jumbotron-fluid">
            <div style="margin-left: 5%; text-align: center;">
                <h3><strong>Cartographie des alertes</strong></h3>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <figure class="highcharts-figure">
                    <div id="container"></div>
                    
                </figure>
            </div>
            <div class="col-md-6">
                <figure class="highcharts-figure">
                    <div id="figure2"></div>
                    <p class="highcharts-description">
                        Taux d'atteinte des résultats
                    </p>
                </figure>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <figure class="highcharts-figure">
                    <div id="figure3"></div>
                    <table id="datatable">
                        
                    </table>
                </figure>
            </div>
            <div class="col-md-6">
                <figure class="highcharts-figure">
                    <div id="figure4"></div>
                    
                </figure>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <figure class="highcharts-figure">
                    <div id="figure5"></div>
                    <table id="datatable">
                        
                    </table>
                </figure>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/maps/modules/map.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://code.highcharts.com/dashboards/datagrid.js"></script>
    <script src="https://code.highcharts.com/dashboards/dashboards.js"></script>
    <script src="https://code.highcharts.com/dashboards/modules/layout.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/offline-exporting.js"></script>
    <script src="https://code.highcharts.com/modules/marker-clusters.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script>
        Highcharts.chart('container', {
            chart: {
                type: 'column'
            },
            title: {
                text: 'Répartition des IDPs & réfugiés par région',
                align: 'left'
            },
            xAxis: {
                categories: ['Agadez', 'Diffa', 'Dosso', 'Maradi', 'Niamey', 'Tahoua', 'Tillabery', 'Zinder'],
                crosshair: true,
                accessibility: {
                    description: 'Regions'
                }
            },
            yAxis: {
                min: 0,
                title: {
                    text: 'Nombre de personnes'
                }
            },
            tooltip: {
                valueSuffix: ' personnes'
            },
            plotOptions: {
                column: {
                    pointPadding: 0.2,
                    borderWidth: 0,
                    dataLabels: {
                        enabled: true,
                        rotation: 270,
                        align: 'center',
                        verticalAlign: 'bottom'
                    }
                }
            },
            series: [
                {
                    name: 'IDPs',
                    data: [387749, 280000, 129000, 64300, 54000, 34300, 0, 0],  // Add data for all regions
                    color: '#1f4e79'  // Dark blue
                },
                {
                    name: 'Réfugiés',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#00b2e2'  // UNICEF blue
                }
            ]
        });


        Highcharts.chart('figure2', {
            chart: {
                type: 'column'
            },
            title: {
                text: "Niveau d'atteinte des résultats par régions",
                align: 'left'
            },
            xAxis: {
                categories: ['Agadez', 'Diffa', 'Dosso', 'Maradi', 'Niamey', 'Tahoua', 'Tillabery', 'Zinder'],
                crosshair: true,
                accessibility: {
                    description: 'Regions'
                }
            },
            yAxis: {
                allowDecimals: false,
                min: 0,
                title: {
                    text: ''
                }
            },
            tooltip: {
                headerFormat: '<b>{point.key}</b><br/>',
                pointFormat: '{series.name}: {point.y}<br/>Total: {point.stackTotal}'
            },
            plotOptions: {
                column: {
                    stacking: 'normal',
                    dataLabels: {
                        enabled: true
                    }
                }
            },
            series: [{
                name: 'Personnes atteintes',
                data: [102, 98, 65, 90, 100, 110, 120, 130],
                stack: 'Personnes',
                color: '#00b2e2'  // UNICEF blue
            }, {
                name: 'Personnes ciblées',
                data: [148, 133, 124, 150, 160, 170, 180, 190],
                stack: 'Personnes',
                color: '#1f4e79'  // Dark blue
            }, {
                name: 'Enfants atteints',
                data: [77, 72, 80, 85, 90, 95, 100, 105],
                stack: 'Enfants',
                color: '#00b2e2'  // Same UNICEF blue as "Personnes atteintes"
            }, {
                name: 'Enfants ciblés',
                data: [113, 122, 95, 130, 140, 150, 160, 170],
                stack: 'Enfants',
                color: '#1f4e79'  // Same dark blue as "Personnes ciblées"
            }]
        });


        Highcharts.chart('figure3', {
            chart: {
                type: 'column'
            },
            title: {
                text: "Situation des personnes atteintes d'handicaps par région",
                align: 'left'
            },
            xAxis: {
                categories: ['Agadez', 'Diffa', 'Dosso', 'Maradi', 'Niamey', 'Tahoua', 'Tillabery', 'Zinder'],
                crosshair: true,
                accessibility: {
                    description: 'Regions'
                }
            },
            yAxis: {
                min: 0,
                title: {
                    text: 'Nombre de personnes'
                }
            },
            tooltip: {
                valueSuffix: ' personnes'
            },
            plotOptions: {
                column: {
                    pointPadding: 0.2,
                    borderWidth: 0,
                    dataLabels: {
                        enabled: true,
                        rotation: 270,
                        align: 'center',
                        verticalAlign: 'bottom'
                    }
                }
            },
            series: [
                {
                    name: 'Filles',
                    data: [387749, 280000, 129000, 64300, 54000, 34300, 0, 0],  // Add data for all regions
                    color: '#1f4e79'  // Dark blue
                },
                {
                    name: 'Garçons',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#00b2e2'  // UNICEF blue
                },
                {
                    name: 'Hommes',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#006400'  // UNICEF blue
                },
                {
                    name: 'Femmes',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#90EE90'  // UNICEF blue
                }
            ]
        });

        
        Highcharts.chart('figure4', {
            chart: {
                plotBackgroundColor: null,
                plotBorderWidth: 0,
                plotShadow: false
            },
            title: {
                text: '50%<br>Enfants & enseignants<br>atteints',
                align: 'center',
                verticalAlign: 'middle',
                y: 60,
                style: {
                    fontSize: '1.1em'
                }
            },
            tooltip: {
                pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'
            },
            accessibility: {
                point: {
                    valueSuffix: '%'
                }
            },
            legend: {
                enabled: true,
                align: 'center',
                verticalAlign: 'bottom',
                layout: 'horizontal'
            },
            plotOptions: {
                pie: {
                    dataLabels: {
                        enabled: false,
                        style: {
                            fontWeight: 'bold',
                            color: 'white'
                        }
                        
                    },
                    startAngle: -90,
                    endAngle: 90,
                    center: ['50%', '75%'],
                    size: '110%'
                }
            },
            series: [{
                type: 'pie',
                name: '',
                innerSize: '75%',
                data: [
                            {name: 'Ciblés', y: 73.86, color: '#1f4e79' },  // Dark blue
                            { name: 'Atteints', y: 11.97, color: '#00b2e2' }  // UNICEF blue
                        ]
            }]
        });
    

        Highcharts.chart('figure5', {
            chart: {
                type: 'column'
            },
            title: {
                text: "Repartition des personnes atteintes par genre et par régions",
                align: 'left'
            },
            xAxis: {
                categories: ['Agadez', 'Diffa', 'Dosso', 'Maradi', 'Niamey', 'Tahoua', 'Tillabery', 'Zinder'],
                crosshair: true,
                accessibility: {
                    description: 'Regions'
                }
            },
            yAxis: {
                min: 0,
                title: {
                    text: 'Nombre de personnes'
                }
            },
            tooltip: {
                valueSuffix: 'personnes'
            },
            plotOptions: {
                column: {
                    pointPadding: 0.2,
                    borderWidth: 0,
                    dataLabels: {
                        enabled: true,
                        rotation: 270,
                        align: 'center',
                        verticalAlign: 'bottom'
                    }
                }
            },
            series: [
                {
                    name: 'Filles',
                    data: [387749, 280000, 129000, 64300, 54000, 34300, 0, 0],  // Add data for all regions
                    color: '#1f4e79'  // Dark blue
                },
                {
                    name: 'Garçons',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#00b2e2'  // UNICEF blue
                },
                {
                    name: 'Hommes',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#006400'  // UNICEF blue
                },
                {
                    name: 'Femmes',
                    data: [45321, 140000, 10000, 140500, 19500, 113500, 0, 0],  // Add data for all regions
                    color: '#90EE90'  // UNICEF blue
                }
            ]
        });

  
    </script>
    {% endblock content %}
</body>
</html>
