{% extends "base.html" %}


{% block content %}

    {% load static %}
    
        <link rel="stylesheet" href="{% static 'css/custum_white_on_blue_background.css' %}">
        <script src="{% static 'js/datepicker_spec.js' %}"></script>

        <!--Oumarou labo 31 Mai ajouter p-1 rounded shadow-lg style="margin-left: 13%; margin-right: 13%;"-->
        <div class="text-center intro p-1 rounded shadow-lg"  style="margin-left: 25%; margin-right: 25%;"   >
            {% if '/activities/rapport-update/' in request.path %}
            <h2>Mise à jour du rapport</h2>
            {% else %}
                <h2>Télécharger un rapport</h2>
            {% endif %}
        </div>
        <div class="container" style="background: #FFFF; width: 50%;" >
          
                <div style="margin:5%">
                    <form enctype="multipart/form-data" method="POST">
                         {% load crispy_forms_tags %}
                        {% csrf_token %}
                        {{form|crispy}}
                        <input type="submit" value="Submit" class="btn btn-success">
                    </form>               
                </div>
                
            </div>
        </div>
    
{% endblock content %}
